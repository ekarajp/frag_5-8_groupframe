name: Cross-platform verification (no analyses)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Linux native runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgomp1 libglu1-mesa
      - run: python -m pip install -r requirements.txt
      - run: python tools/prepare_data.py
      - run: python tools/doctor.py --solver-import
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python tests/portability_no_analysis.py
      - run: python tests/seed_probe.py
      - run: python app/verify.py
